<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1F5C4A">
    <title>آسوده | بدون اتصال</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, "Segoe UI", Tahoma, sans-serif; }
      body { margin: 0; background: #F6F7F2; color: #1D2925; }
      main { box-sizing: border-box; margin: 10vh auto; max-width: 38rem; padding: 2rem; }
      section { background: white; border: 1px solid #D9EBDD; border-radius: 1rem; padding: 2rem; }
      img { display: block; width: 3.5rem; height: 3.5rem; margin-block-end: 1rem; }
      a { display: inline-block; margin-block-start: 1rem; min-height: 2.75rem; border: 0; border-radius: .5rem; padding: .7rem 1rem; background: #1F5C4A; color: white; font: inherit; text-decoration: none; }
      :focus-visible { outline: 3px solid #D89A5B; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <section>
        <img src="/icons/app-icon.svg" alt="نشان آسوده" width="56" height="56">
        <h1>اتصال اینترنت در دسترس نیست</h1>
        <p>اطلاعات مالی شما در حالت آفلاین بارگذاری نمی‌شود.</p>
        <p>پس از اتصال دوباره می‌توانید به برنامه برگردید.</p>
        <a href="/">بررسی دوبارهٔ اتصال</a>
        <a href="/transactions">بازگشت به برنامه</a>
      </section>
    </main>
  </body>
</html>
